name: Feature Request
description: Suggest an idea or enhancement for GXE-Search-Queue
title: '[FEAT] '
labels: ['enhancement']
assignees: ''
body:
  - type: markdown
    attributes:
      value: Tell us about the feature you would like to see!
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is your feature request related to a problem? Please describe it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
    validations:
      required: false
