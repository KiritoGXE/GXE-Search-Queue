name: Bug Report
description: Create a report to help us fix a bug
title: '[BUG] '
labels: ['bug']
assignees: ''
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run '...'
        2. Post request to '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant terminal or application logs.
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Docker
        - Bare metal (Linux)
        - Bare metal (macOS)
        - Kubernetes
        - Other
    validations:
      required: false
