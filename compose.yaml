# ==============================================================================
# GXE-Search-Queue — local development stack
# Usage: docker compose up -d
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://gxe:gxe@postgres:5432/gxe_search_queue
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"   # REST API
      - "8081:8081"   # Dashboard
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gxe
      POSTGRES_PASSWORD: gxe
      POSTGRES_DB: gxe_search_queue
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gxe -d gxe_search_queue"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
