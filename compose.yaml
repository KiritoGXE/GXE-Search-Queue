services:
  app:
    build:
      context: .
    image: ghcr.io/kiritogxe/gxe-search-queue:0.1.0-pre
    restart: unless-stopped
    ports:
      - "${GXE_PORT:-8080}:8080"
    environment:
      DATABASE_PATH: /app/data/gxe-search-queue.sqlite3
      RUST_LOG: ${RUST_LOG:-info}
      GXE_ADMIN_TOKEN: ${GXE_ADMIN_TOKEN:?Set GXE_ADMIN_TOKEN in .env}
      SEERR_URL: ${SEERR_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
    volumes:
      - app-data:/app/data

volumes:
  app-data:
